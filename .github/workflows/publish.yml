name: Publish Portfolio Build

on:
  repository_dispatch:
    types: [publish-site]
  workflow_dispatch:

concurrency:
  group: github-pages-publish
  cancel-in-progress: true

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Read-Only Static Generator
        shell: pwsh
        run: |
          pwsh -ExecutionPolicy Bypass -File "./scripts/generate-photo-pages.ps1"

      - name: Check for File Differences
        id: git-check
        shell: bash
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "No generated asset changes detected. Skipping deployment."
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit and Push Generated Assets (Only if changed)
        if: steps.git-check.outputs.changed == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "auto-publish: sync static pages & sitemaps [skip ci]"
          git push origin main
